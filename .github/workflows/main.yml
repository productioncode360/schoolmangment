jobs:
  # 1. Pehle sirf Testing wali image banegi
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push DEV Tag
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: 6265207463/schoolmangment:dev # Sirf Tester ke liye

  # 2. Ye tabhi chalega jab aap Approval denge
  deploy-prod:
    needs: build-test # Pehle upar wala step hona zaroori hai
    runs-on: ubuntu-latest
    environment: production # Yahan Manual Approval rukega
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Tag and Push PROD Tag
        run: |
          docker pull 6265207463/schoolmangment:dev
          docker tag 6265207463/schoolmangment:dev 6265207463/schoolmangment:prod
          docker push 6265207463/schoolmangment:prod