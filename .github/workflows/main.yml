name: Production-Pipeline

on:
  push:
    branches: [ "main", "dev-setup" ]

jobs:
  # STEP 1: Pehle 'dev' image banegi jo Tester check karega
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push DEV Tag
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: 6265207463/schoolmangment:dev

  # STEP 2: Ye tabhi chalega jab aap Manual Approve karoge
  deploy-prod:
    needs: build-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Promote Dev to Prod
        run: |
          docker pull 6265207463/schoolmangment:dev
          docker tag 6265207463/schoolmangment:dev 6265207463/schoolmangment:prod
          docker push 6265207463/schoolmangment:prod